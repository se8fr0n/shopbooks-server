<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>Maya Computers Books</title>
<link rel="icon" href="/icon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#d9d7da;--side:#fff;--card:#fff;--ink:#161616;--mut:#74717a;--line:#e6e4e8;--dark:#1b1b1b;--field:#f4f3f5;--good:#1f8a4c;--bad:#c23b3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f10;--side:#18181a;--card:#1d1d20;--ink:#f1f0f2;--mut:#9a98a0;--line:#2c2c30;--dark:#2a2a2e;--field:#26262a}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:flex;min-height:100vh}
aside{width:210px;background:var(--side);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:800;font-size:19px;letter-spacing:-.5px;padding:0 8px 14px;line-height:1.1}
.nav{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--mut);border:0;background:none;font:inherit;text-align:left;width:100%}
.nav:hover,.nav.on{background:var(--field)}.nav.on{color:var(--ink);font-weight:600}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.sp{flex:1}.me{font-size:12px;color:var(--mut);padding:6px 10px}
main{flex:1;padding:22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:24px;margin:0;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;outline:none}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}.btn.sm{padding:5px 9px;font-size:12px}.btn.red{color:var(--bad)}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--good);border-radius:8px;padding:6px 10px;cursor:pointer}
.chip.wait{color:#a86a00}.chip.off{color:var(--bad)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:1.4fr 1fr;margin-top:14px}
.card{background:var(--card);border-radius:16px;padding:16px}.card.dk{background:var(--dark);color:#fff}.card.warn{margin-bottom:14px;border:1px solid var(--bad)}
.lab{color:var(--mut);font-size:12px}.dk .lab{color:#bdbbc2}.big{font-size:24px;font-weight:700;margin:8px 0 4px}.sub{font-size:11px;color:var(--mut)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}.tw{overflow-x:auto}
.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;background:var(--field)}.tag.paid{background:#8d8b90;color:#fff}.tag.debt{background:var(--dark);color:#fff}.tag.void{text-decoration:line-through;color:var(--mut)}
.mut{color:var(--mut)}.bad{color:var(--bad)}.empty{padding:26px;text-align:center;color:var(--mut)}.note{font-size:12px;color:var(--mut);margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow:auto}.box h2{margin:0 0 14px;font-size:18px}
.f{display:grid;gap:10px;grid-template-columns:1fr 1fr}.f .w{grid-column:1/-1}label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.auth .box{max-width:360px}.auth input{margin-bottom:10px}
.doc{background:#fff;color:#000;padding:24px;border-radius:8px}.doc th,.doc td{color:#000;border-color:#ddd}
.fab{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.35);padding:13px 18px}
@media(max-width:900px){.g2{grid-template-columns:1fr}.app{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;align-items:center}.logo{padding:0 10px 0 4px}.sp,.me,.side-rec{display:none}.nav{width:auto;white-space:nowrap}main{padding:14px}.fab{display:block}}
@media print{body *{visibility:hidden}.doc,.doc *{visibility:visible}.doc{position:absolute;left:0;top:0;width:100%}}
</style></head><body>
<div id="root"></div><div id="mod"></div>
<script>
const SHOP='Maya Computers',PHONE='+254 792 631529';
const $=s=>document.querySelector(s),L=localStorage;
const get=(k,d)=>{try{const v=JSON.parse(L.getItem(k));return v==null?d:v}catch(e){return d}},set=(k,v)=>{try{L.setItem(k,JSON.stringify(v))}catch(e){}};
let D=get('sb_d',{items:[],sales:[],lines:[],payments:[],expenses:[]}),OUT=get('sb_o',[]),BAD=get('sb_b',[]),ME=get('sb_me',null),TOK=get('sb_t',null),NOTE=[],view='Dashboard',busy=false,rows=1;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'KSh '+Math.round(n||0).toLocaleString('en-KE'),today=()=>new Date().toISOString().slice(0,10),uid=()=>crypto.randomUUID();
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0),RANK={cashier:1,manager:2,owner:3},can=r=>ME&&RANK[ME.role]>=RANK[r];
async function api(m,p,b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK}:{})},body:b?JSON.stringify(b):undefined});let d={};try{d=await r.json()}catch(e){}
 if(r.status===401&&p!=='/login'&&TOK){TOK=null;ME=null;set('sb_t',null);set('sb_me',null);boot()}
 if(!r.ok)throw Object.assign(new Error(d.error||'Error'),{status:r.status});return d}

/* effective data = last server copy + operations still waiting to sync */
const bal=s=>s.status=='void'?0:s.total-s.paid-sum(s.pays,x=>x);
function V(){const items=D.items.map(i=>({...i})),fi=id=>items.find(i=>i.id==id);
 const sales=D.sales.map(s=>({...s,lines:D.lines.filter(l=>l.sale_id==s.id),pays:D.payments.filter(p=>p.sale_id==s.id).map(p=>+p.amount)})),fs=id=>sales.find(s=>s.id==id),exp=[...D.expenses];
 for(const o of OUT){const p=o.payload;
  if(o.type=='item.create')items.push({id:p.id,name:p.name,category:p.category||'',qty:+p.qty||0,buy_price:+p.buy_price||0,sell_price:+p.sell_price||0,min_qty:+p.min_qty||0});
  else if(o.type=='item.restock'){const i=fi(p.item_id);if(i)i.qty+=+p.qty}
  else if(o.type=='sale.create'){const lines=p.items.map(i=>({name:i.name,qty:+i.qty,price:+i.price,cost:0,item_id:i.item_id}));const total=sum(lines,l=>l.qty*l.price);
   lines.forEach(l=>{const i=fi(l.item_id);if(i)i.qty-=l.qty});sales.unshift({id:p.id,no:null,date:p.date||today(),customer:p.customer.name,phone:p.customer.phone||'',total,paid:Math.min(+p.paid||0,total),status:'active',lines,pays:[],pend:1})}
  else if(o.type=='payment.create'){const s=fs(p.sale_id);if(s)s.pays.push(+p.amount)}
  else if(o.type=='sale.void'){const s=fs(p.sale_id);if(s){s.status='void';s.void_reason=p.reason;s.lines.forEach(l=>{const i=fi(l.item_id);if(i)i.qty+=l.qty})}}
  else if(o.type=='expense.create')exp.unshift({...p,amount:+p.amount,date:p.date||today()})}
 return{items,sales,exp}}

/* sync */
function queue(type,payload){OUT.push({id:uid(),type,payload});set('sb_o',OUT);render();sync()}
async function sync(){if(busy||!TOK||!navigator.onLine)return;busy=true;render();
 try{while(OUT.length){const r=await api('POST','/sync/push',{ops:OUT.slice(0,50)});
   for(const x of r.results){const i=OUT.findIndex(o=>o.id==x.id);if(i<0)continue;const o=OUT[i];
    if(x.ok){OUT.splice(i,1);if(x.result&&x.result.warnings)NOTE.push(...x.result.warnings)}else if(x.permanent){OUT.splice(i,1);BAD.push({type:o.type,error:x.error})}}
   set('sb_o',OUT);set('sb_b',BAD);if(r.results.every(x=>!x.ok&&!x.permanent))break}
  const s=await api('GET','/snapshot');D={items:s.items,sales:s.sales,lines:s.lines,payments:s.payments,expenses:s.expenses};ME=s.user;set('sb_d',D);set('sb_me',ME)}catch(e){}
 busy=false;render()}
addEventListener('online',sync);addEventListener('offline',render);setInterval(sync,60000);

/* login / setup */
async function boot(){if(TOK&&ME){render();sync();return}let st={};try{st=await api('GET','/status')}catch(e){}auth(st.needsSetup)}
function auth(setup){$('#root').innerHTML=`<div class="auth"><div class="box"><h2>${esc(SHOP)}</h2><div class="note" style="margin:-8px 0 14px">${setup?'First time: create the owner account.':'Sign in to your books.'}</div>
${setup?'<input id="an" placeholder="Your full name">':''}<input id="au" placeholder="Username" autocapitalize="none"><input id="ap" type="password" placeholder="Password${setup?' (8+ characters)':''}" onkeydown="if(event.key==='Enter')doAuth(${!!setup})">
<button class="btn pri" style="width:100%" onclick="doAuth(${!!setup})">${setup?'Create owner account':'Sign in'}</button><div class="note" id="ae"></div><div class="note"><a href="/privacy.html">Privacy</a> and <a href="/terms.html">Terms</a></div></div></div>`}
async function doAuth(setup){const u=$('#au').value.trim(),p=$('#ap').value;try{if(setup)await api('POST','/setup',{name:$('#an').value,username:u,password:p});
 const r=await api('POST','/login',{username:u,password:p});TOK=r.token;ME=r.user;set('sb_t',TOK);set('sb_me',ME);D={items:[],sales:[],lines:[],payments:[],expenses:[]};view='Dashboard';render();sync()}
 catch(e){$('#ae').textContent=navigator.onLine?e.message:'You need internet for the first sign in.'}}
function logout(){if(OUT.length&&!confirm(OUT.length+' entries have not synced yet and will be lost. Log out anyway?'))return;
 ['sb_t','sb_me','sb_d','sb_o','sb_b'].forEach(k=>L.removeItem(k));TOK=ME=null;OUT=[];BAD=[];D={items:[],sales:[],lines:[],payments:[],expenses:[]};boot()}

/* layout */
const IC={Dashboard:'M3 12l9-8 9 8M5 10v10h14V10',Sales:'M4 6h16M4 12h16M4 18h10',Debts:'M12 3v18M17 7H9.5a3 3 0 000 6h5a3 3 0 010 6H7',Stock:'M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7',Expenses:'M3 8h18v12H3zM7 8V4h10v4',Staff:'M16 11a4 4 0 10-8 0M4 21a8 8 0 0116 0',Activity:'M3 12h4l3-8 4 16 3-8h4'};
const nav=()=>['Dashboard','Sales','Debts','Stock',...(can('manager')?['Expenses']:[]),...(can('owner')?['Staff','Activity']:[])];
function chip(){const n=OUT.length,off=!navigator.onLine;return`<button class="chip ${off?'off':n?'wait':''}" onclick="sync()">${off?'Offline'+(n?', '+n+' waiting':''):busy?'Syncing...':n?n+' waiting to sync':'All saved'}</button>`}
function head(t,b){return`<div class="top"><h1>${t}</h1><div class="row">${chip()}${b||''}</div></div>`+banners()}
function banners(){let h='';if(BAD.length)h+=`<div class="card warn"><b>${BAD.length} entries were rejected by the server and were not saved:</b>${BAD.map(b=>`<div>${esc(b.type)}: ${esc(b.error)}</div>`).join('')}<button class="btn sm" style="margin-top:8px" onclick="BAD=[];set('sb_b',BAD);render()">Dismiss</button></div>`;
 if(NOTE.length)h+=`<div class="card warn">${NOTE.map(esc).join('<br>')}<br><button class="btn sm" style="margin-top:8px" onclick="NOTE=[];render()">Dismiss</button></div>`;return h}
function go(v){view=v;render()}
function render(){if(!ME||!TOK)return;const fn={Dashboard:vDash,Sales:vSales,Debts:vDebts,Stock:vStock,Expenses:vExp,Staff:vStaff,Activity:vAct}[view]||vDash;
 $('#root').innerHTML=`<div class="app"><aside><div class="logo">${esc(SHOP)}</div><button class="btn pri side-rec" style="width:100%;margin-bottom:10px" onclick="saleForm()">Record sale</button>${nav().map(v=>`<button class="nav ${v==view?'on':''}" onclick="go('${v}')"><svg viewBox="0 0 24 24"><path d="${IC[v]}"/></svg>${v}</button>`).join('')}<div class="sp"></div><div class="me">${esc(ME.name)} (${ME.role})</div><button class="nav" onclick="logout()">Log out</button></aside><main>${fn(V())}</main></div><button class="btn pri fab" onclick="saleForm()">Record sale</button>`;
 if(view=='Staff')loadStaff();if(view=='Activity')loadAct()}

/* views */
const noOf=s=>s.no?'S'+String(s.no).padStart(4,'0'):'Pending';
const status=s=>s.status=='void'?'<span class="tag void">Void</span>':bal(s)>0?'<span class="tag debt">On debt</span>':'<span class="tag paid">Paid</span>';
function sTable(list,mini){if(!list.length)return'<div class="empty">No sales recorded yet.</div>';
 return`<div class="tw"><table><tr><th>No.</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Balance</th><th>Status</th>${mini?'':'<th></th>'}</tr>`+list.map(s=>`<tr><td>${noOf(s)}</td><td>${s.date}</td><td>${esc(s.customer)}</td><td>${esc(s.lines.map(l=>l.qty+' x '+l.name).join(', '))}</td><td>${money(s.total)}</td><td>${money(bal(s))}</td><td>${status(s)}</td>${mini?'':`<td class="row"><button class="btn sm" onclick="docView('${s.id}')">Receipt</button>${s.status=='void'||!can('manager')?'':`<button class="btn sm red" onclick="voidSale('${s.id}')">Void</button>`}</td>`}</tr>`).join('')+'</table></div>'}
function vDash(v){const mk=today().slice(0,7),act=v.sales.filter(s=>s.status=='active'),sm=act.filter(s=>s.date.slice(0,7)==mk),rev=sum(sm,s=>s.total),owed=sum(act,bal),low=v.items.filter(i=>i.qty<=i.min_qty);
 const ex=sum(v.exp.filter(e=>e.date.slice(0,7)==mk),e=>e.amount),gp=rev-sum(sm,s=>sum(s.lines,l=>(l.cost||0)*l.qty)),deb={};
 act.forEach(s=>{const b=bal(s);if(b>0)deb[s.customer]=(deb[s.customer]||0)+b});const dl=Object.entries(deb).sort((a,b)=>b[1]-a[1]).slice(0,6);
 return head('Dashboard','<button class="btn pri" onclick="saleForm()">Record sale</button>')+`<div class="grid"><div class="card dk"><div class="lab">Sales this month</div><div class="big">${money(rev)}</div><div class="sub" style="color:#bdbbc2">${sm.length} records</div></div>
<div class="card"><div class="lab">Owed by customers</div><div class="big">${money(owed)}</div><div class="sub">${Object.keys(deb).length} customers</div></div>
${can('manager')?`<div class="card"><div class="lab">Gross profit this month</div><div class="big">${money(gp)}</div><div class="sub">Pending entries count fully after sync</div></div><div class="card"><div class="lab">Expenses this month</div><div class="big">${money(ex)}</div></div>`:''}</div>
<div class="grid g2"><div class="card"><div class="lab" style="margin-bottom:6px">Recent sales</div>${sTable(v.sales.slice(0,6),true)}</div>
<div class="card"><div class="lab" style="margin-bottom:8px">Biggest debtors</div>${dl.length?dl.map(([c,b])=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(c)}</span><b>${money(b)}</b></div>`).join(''):'<div class="empty">No debts</div>'}
${low.length?'<div class="lab" style="margin:14px 0 6px">Low stock</div>'+low.slice(0,5).map(i=>`<div class="row" style="justify-content:space-between"><span>${esc(i.name)}</span><span class="bad">${i.qty} left</span></div>`).join(''):''}</div></div>`}
const vSales=v=>head('Sales','<button class="btn pri" onclick="saleForm()">Record sale</button>')+`<div class="card">${sTable(v.sales)}<div class="note">Saved records are locked on the server. A mistake is corrected by a manager voiding it with a reason, then recording again.</div></div>`;
function vDebts(v){const l=v.sales.filter(s=>bal(s)>0);return head('Debts','<button class="btn pri" onclick="debtForm()">Add debt</button>')+`<div class="grid" style="margin-bottom:14px"><div class="card dk"><div class="lab">Total owed</div><div class="big">${money(sum(l,bal))}</div></div></div><div class="card">${l.length?`<div class="tw"><table><tr><th>Customer</th><th>Phone</th><th>Sale</th><th>Date</th><th>Total</th><th>Balance</th><th></th></tr>`+l.map(s=>`<tr><td>${esc(s.customer)}</td><td>${esc(s.phone)}</td><td>${noOf(s)}</td><td>${s.date}</td><td>${money(s.total)}</td><td><b>${money(bal(s))}</b></td><td><button class="btn sm" onclick="payForm('${s.id}')">Add payment</button></td></tr>`).join('')+'</table></div>':'<div class="empty">Nothing owed.</div>'}</div>`}
function vStock(v){const m=can('manager');return head('Stock',m?'<button class="btn pri" onclick="stockForm()">Add item</button>':'')+`<div class="card">${v.items.length?`<div class="tw"><table><tr><th>Item</th><th>Category</th><th>Qty</th>${m?'<th>Buy</th>':''}<th>Sell</th>${m?'<th></th>':''}</tr>`+v.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.category)}</td><td class="${i.qty<=i.min_qty?'bad':''}">${i.qty}</td>${m?`<td>${money(i.buy_price)}</td>`:''}<td>${money(i.sell_price)}</td>${m?`<td><button class="btn sm" onclick="restock('${i.id}')">Restock</button></td>`:''}</tr>`).join('')+'</table></div>':'<div class="empty">No items yet.</div>'}</div>`}
const vExp=v=>head('Expenses','<button class="btn pri" onclick="expForm()">Add expense</button>')+`<div class="card">${v.exp.length?`<div class="tw"><table><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th></tr>`+v.exp.map(e=>`<tr><td>${e.date}</td><td>${esc(e.category)}</td><td>${esc(e.note||'')}</td><td>${money(e.amount)}</td></tr>`).join('')+'</table></div>':'<div class="empty">No expenses recorded.</div>'}</div>`;
const vStaff=()=>head('Staff','<button class="btn pri" onclick="staffForm()">Add staff</button>')+'<div class="card" id="stf"><div class="empty">Loading...</div></div>';
const vAct=()=>head('Activity log','<button class="btn" onclick="loadAct()">Verify log</button>')+'<div id="vf"></div><div class="card" id="act"><div class="empty">Loading...</div></div>';

/* forms */
function modal(h){$('#mod').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="box">${h}</div></div>`}function closeM(){$('#mod').innerHTML=''}
const btns=(ok,fn)=>`<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="closeM()">Cancel</button><button class="btn pri" onclick="${fn}">${ok}</button></div>`;
const saleRow=i=>`<div class="f" style="margin-bottom:8px"><div class="w"><select id="s${i}" onchange="pick(${i})"><option value="">Item not in stock list</option>${V().items.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.qty} in stock)</option>`).join('')}</select></div><div><input id="n${i}" placeholder="Item name"></div><div class="row"><input id="q${i}" type="number" min="1" value="1" style="width:70px" oninput="tot()"><input id="p${i}" type="number" min="0" placeholder="Price" oninput="tot()"></div></div>`;
function saleForm(){rows=1;modal(`<h2>Record sale</h2><div class="f"><div><label>Customer</label><input id="c" placeholder="Name"></div><div><label>Phone</label><input id="ph" placeholder="Optional"></div></div><div id="rw" style="margin-top:12px">${saleRow(0)}</div><button class="btn sm" style="margin-top:8px" onclick="addRow()">Add another item</button><div class="f" style="margin-top:12px"><div><label>Amount paid now (KSh)</label><input id="pd" type="number" min="0" placeholder="0"></div><div><label>Total</label><input id="tt" disabled></div></div><div class="note">Anything unpaid is saved as a debt. Works offline.</div>${btns('Save and lock','saveSale()')}`)}
function addRow(){const d=document.createElement('div');d.innerHTML=saleRow(rows);$('#rw').appendChild(d.firstChild);rows++}
function pick(i){const s=V().items.find(x=>x.id==$('#s'+i).value);if(s){$('#n'+i).value=s.name;$('#p'+i).value=s.sell_price}tot()}
function tot(){let t=0;for(let i=0;i<rows;i++)t+=(+$('#q'+i).value||0)*(+$('#p'+i).value||0);$('#tt').value=money(t)}
function saveSale(){const cust=$('#c').value.trim();if(!cust)return alert('Enter the customer name');const items=[],st=V().items;
 for(let i=0;i<rows;i++){const n=$('#n'+i).value.trim(),q=+$('#q'+i).value,pv=$('#p'+i).value,sid=$('#s'+i).value;if(!n||!(q>0)||pv==='')continue;const it=st.find(x=>x.id==sid);
  if(it&&q>it.qty&&!confirm('Only '+it.qty+' of '+it.name+' in stock. Record anyway?'))return;items.push({name:n,qty:q,price:+pv,item_id:sid||undefined})}
 if(!items.length)return alert('Add at least one item with a price');queue('sale.create',{id:uid(),customer:{name:cust,phone:$('#ph').value.trim()},items,paid:+$('#pd').value||0,date:today()});closeM()}
function voidSale(id){const r=prompt('Reason for voiding this sale? This cannot be undone.');if(r&&r.trim().length>=3)queue('sale.void',{sale_id:id,reason:r.trim()});else if(r)alert('Give a clearer reason')}
function debtForm(){modal(`<h2>Add debt</h2><div class="f"><div><label>Customer</label><input id="dc"></div><div><label>Phone</label><input id="dp" placeholder="Optional"></div><div class="w"><label>What was taken or what it is for</label><input id="dn"></div><div><label>Amount owed (KSh)</label><input id="da" type="number" min="1"></div><div><label>Already paid (KSh)</label><input id="dd" type="number" min="0" placeholder="0"></div></div>${btns('Save debt','saveDebt()')}`)}
function saveDebt(){const c=$('#dc').value.trim(),n=$('#dn').value.trim(),a=+$('#da').value,d=+$('#dd').value||0;if(!c||!n||!(a>0))return alert('Enter the customer, what it is for, and the amount');if(d>=a)return alert('Already paid must be less than the amount owed');
 queue('sale.create',{id:uid(),customer:{name:c,phone:$('#dp').value.trim()},items:[{name:n,qty:1,price:a}],paid:d,date:today()});closeM()}
function payForm(id){const s=V().sales.find(x=>x.id==id);modal(`<h2>Payment from ${esc(s.customer)}</h2><div class="note" style="margin:0 0 10px">Balance: ${money(bal(s))}</div><div class="f"><div><label>Amount (KSh)</label><input id="pa" type="number" min="1"></div><div><label>Method</label><select id="pm"><option>cash</option><option>mpesa</option><option>bank</option></select></div></div>${btns('Save payment',`savePay('${id}')`)}`)}
function savePay(id){const s=V().sales.find(x=>x.id==id),a=+$('#pa').value;if(!(a>0)||a>bal(s)+.001)return alert('Enter an amount up to the balance');queue('payment.create',{id:uid(),sale_id:id,amount:a,method:$('#pm').value});closeM()}
function stockForm(){modal(`<h2>Add stock item</h2><div class="f"><div class="w"><label>Name</label><input id="a"></div><div><label>Category</label><input id="b"></div><div><label>Quantity</label><input id="q" type="number" min="0"></div><div><label>Buying price</label><input id="by" type="number" min="0"></div><div><label>Selling price</label><input id="sl" type="number" min="0"></div><div><label>Low stock alert at</label><input id="mn" type="number" min="0" value="2"></div></div>${btns('Save','saveStock()')}`)}
function saveStock(){const n=$('#a').value.trim();if(!n)return alert('Enter a name');queue('item.create',{id:uid(),name:n,category:$('#b').value,qty:+$('#q').value||0,buy_price:+$('#by').value||0,sell_price:+$('#sl').value||0,min_qty:+$('#mn').value||0});closeM()}
function restock(id){const q=+prompt('Quantity received?');if(q>0)queue('item.restock',{item_id:id,qty:q})}
function expForm(){modal(`<h2>Add expense</h2><div class="f"><div><label>Category</label><select id="ec"><option>Rent</option><option>Transport</option><option>Salaries</option><option>Electricity and internet</option><option>Supplies</option><option>Other</option></select></div><div><label>Amount (KSh)</label><input id="ea" type="number" min="1"></div><div class="w"><label>Note</label><input id="en"></div></div>${btns('Save and lock','saveExp()')}`)}
function saveExp(){const a=+$('#ea').value;if(!(a>0))return alert('Enter an amount');queue('expense.create',{id:uid(),category:$('#ec').value,amount:a,note:$('#en').value,date:today()});closeM()}
function docView(id){const s=V().sales.find(x=>x.id==id);modal(`<div class="doc"><h2 style="margin:0">${esc(SHOP)}</h2><div style="color:#444">${esc(PHONE)}</div><h3 style="margin:14px 0 4px">Receipt ${noOf(s)}</h3><div style="margin-bottom:12px;color:#444">${s.date}<br>Customer: ${esc(s.customer)} ${esc(s.phone||'')}${s.status=='void'?'<br><b>VOID: '+esc(s.void_reason)+'</b>':''}</div><table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Amount</th></tr>${s.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</table><p><b>Total: ${money(s.total)}</b><br>Paid at sale: ${money(s.paid)}${s.pays.map(p=>'<br>Payment: '+money(p)).join('')}<br><b>Balance: ${money(bal(s))}</b></p>${s.pend?'<p style="font-size:12px">Not yet synced. The final receipt number is given after sync.</p>':''}</div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" onclick="closeM()">Close</button><button class="btn pri" onclick="window.print()">Print</button></div>`)}

/* staff and audit (online only) */
async function loadStaff(){const el=$('#stf');if(!el)return;if(!navigator.onLine){el.innerHTML='<div class="empty">Staff management needs internet.</div>';return}
 try{const u=await api('GET','/users');el.innerHTML=`<div class="tw"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr>`+u.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td><select onchange="upd('${x.id}',{role:this.value})" style="width:auto">${['cashier','manager','owner'].map(r=>`<option ${r==x.role?'selected':''}>${r}</option>`).join('')}</select></td><td>${x.active?'Active':'Disabled'}</td><td><button class="btn sm" onclick="upd('${x.id}',{active:${!x.active}})">${x.active?'Disable':'Enable'}</button> <button class="btn sm" onclick="resetPw('${x.id}')">New password</button></td></tr>`).join('')+'</table></div><div class="note">Cashier: record sales and debt payments. Manager: also stock, expenses, voids and profit. Owner: everything, plus staff and the activity log.</div>'}catch(e){el.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function upd(id,b){try{await api('PATCH','/users/'+id,b)}catch(e){alert(e.message)}loadStaff()}
function resetPw(id){const p=prompt('New password (8+ characters)');if(p)upd(id,{password:p})}
function staffForm(){modal(`<h2>Add staff</h2><div class="f"><div><label>Full name</label><input id="sn"></div><div><label>Username</label><input id="su" autocapitalize="none"></div><div><label>Password (8+)</label><input id="sp" type="password"></div><div><label>Role</label><select id="sr"><option>cashier</option><option>manager</option><option>owner</option></select></div></div>${btns('Create account','saveStaff()')}`)}
async function saveStaff(){try{await api('POST','/users',{name:$('#sn').value,username:$('#su').value,password:$('#sp').value,role:$('#sr').value});closeM();loadStaff()}catch(e){alert(e.message)}}
async function loadAct(){const el=$('#act');if(!el)return;if(!navigator.onLine){el.innerHTML='<div class="empty">The activity log needs internet.</div>';return}
 try{const[v,a]=await Promise.all([api('GET','/audit/verify'),api('GET','/audit?limit=300')]);$('#vf').innerHTML=`<div class="card ${v.ok?'':'warn'}" style="margin-bottom:14px"><b class="${v.ok?'':'bad'}">${esc(v.message)}</b>${v.ok?' ('+v.entries+' entries checked)':''}</div>`;
  el.innerHTML=`<div class="tw"><table><tr><th>Time</th><th>Who</th><th>Action</th><th>Details</th></tr>`+a.map(r=>{let d='';try{d=JSON.stringify(JSON.parse(r.body).data)}catch(e){}return`<tr><td class="mut">${new Date(r.at).toLocaleString('en-KE')}</td><td>${esc(r.user_name)}</td><td>${esc(r.action)}</td><td class="mut">${esc(d)}</td></tr>`}).join('')+'</table></div>'}catch(e){el.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
boot();
</script></body></html>
